<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Event Manager</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Event<span>Manager</span>
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <section class="registration-section">

        <div class="registration-container">

            <h2>
                🔐 Admin Login
            </h2>


            <p class="login-description">
                Login to manage participants.
            </p>


            <form id="adminLoginForm">


                <div class="form-group">

                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn primary register-btn"
                >
                    Login
                </button>


            </form>


            <p class="demo-login">

                Demo Username: admin
                <br>

                Demo Password: 1234

            </p>

        </div>

    </section>



    <footer>

        <p>
            © 2026 Event Participant Manager
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
