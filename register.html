<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Event Manager</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Event<span>Manager</span>
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="admin-login.html">
                Admin
            </a>

        </div>

    </nav>



    <section class="page-header">

        <h1>
            Event Registration
        </h1>

        <p>
            Fill in your details to register.
        </p>

    </section>



    <section class="registration-section">

        <div class="registration-container">

            <h2>
                Participant Details
            </h2>


            <form id="registrationForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Example: CSE"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select id="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="event">
                        Select Event
                    </label>

                    <select id="event" required>

                        <option value="">
                            Select Event
                        </option>

                        <option value="Code Challenge">
                            Code Challenge
                        </option>

                        <option value="AI & Robotics Workshop">
                            AI & Robotics Workshop
                        </option>

                        <option value="College Cultural Fest">
                            College Cultural Fest
                        </option>

                        <option value="Inter College Sports Meet">
                            Inter College Sports Meet
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn primary register-btn"
                >
                    Submit Registration
                </button>


            </form>

        </div>

    </section>



    <footer>

        <p>
            © 2026 Event Participant Manager
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
