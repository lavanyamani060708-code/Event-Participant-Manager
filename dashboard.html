<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | Event Manager</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Event<span>Manager</span>
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="admin-login.html">
                Admin
            </a>

        </div>

    </nav>



    <section class="page-header">

        <h1>
            Participant Dashboard
        </h1>

        <p>
            View your latest registration details.
        </p>

    </section>



    <section class="dashboard-section">

        <div class="dashboard-card">

            <h2>
                Registration Details
            </h2>


            <div class="detail-row">

                <strong>
                    Name
                </strong>

                <span id="displayName">
                    -
                </span>

            </div>


            <div class="detail-row">

                <strong>
                    Email
                </strong>

                <span id="displayEmail">
                    -
                </span>

            </div>


            <div class="detail-row">

                <strong>
                    Phone
                </strong>

                <span id="displayPhone">
                    -
                </span>

            </div>


            <div class="detail-row">

                <strong>
                    College
                </strong>

                <span id="displayCollege">
                    -
                </span>

            </div>


            <div class="detail-row">

                <strong>
                    Department
                </strong>

                <span id="displayDepartment">
                    -
                </span>

            </div>


            <div class="detail-row">

                <strong>
                    Event
                </strong>

                <span id="displayEvent">
                    -
                </span>

            </div>


            <div class="dashboard-status">

                <p>
                    Total Registrations:
                    <strong id="participantCount">
                        0
                    </strong>
                </p>


                <p>
                    Registered:
                    <strong id="registrationStatus">
                        No
                    </strong>
                </p>

            </div>


            <a
                href="events.html"
                class="btn primary"
            >
                Explore More Events
            </a>

        </div>

    </section>



    <footer>

        <p>
            © 2026 Event Participant Manager
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
